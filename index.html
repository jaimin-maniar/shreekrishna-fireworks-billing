<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fireworks Billing</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--text:#14181f;--muted:#5b6573;--line:#d5dae2;--pri:#b3123f;--prit:#fff;--soft:#fbe6ec;--ok:#0b7a43;--bad:#b42318;--hd:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151a;--card:#1c2027;--text:#f1f3f6;--muted:#a3adba;--line:#323945;--pri:#ff5c80;--prit:#14181f;--soft:#3a1d27;--ok:#4ad08a;--bad:#ff8a80;--hd:#1c2027}}
:root[data-theme="dark"]{--bg:#12151a;--card:#1c2027;--text:#f1f3f6;--muted:#a3adba;--line:#323945;--pri:#ff5c80;--prit:#14181f;--soft:#3a1d27;--ok:#4ad08a;--bad:#ff8a80;--hd:#1c2027}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--line);background:var(--card);border-radius:12px;min-height:48px;padding:0 16px;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center}
.hd h1{font-size:18px;margin:0 auto 0 0;white-space:nowrap}
.tab{min-width:92px}
.tab[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--prit)}
.wrap{max-width:1100px;margin:0 auto;padding:12px 12px 96px}
.cols{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h2{font-size:18px;margin:0 0 10px}
.inp{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-top:10px}
.item{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:88px;padding:10px 12px;font-weight:500}
.item:active:not(:disabled){background:var(--soft);border-color:var(--pri)}
.iname{font-weight:700;overflow-wrap:anywhere}
.iprice{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.istock{font-size:14px;color:var(--muted)}
.istock.low{color:var(--bad);font-weight:700}
.badge{position:absolute;top:8px;right:8px;background:var(--pri);color:var(--prit);border-radius:99px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:800;font-size:15px;padding:0 6px}
.muted{color:var(--muted)}
.empty{padding:20px 8px;text-align:center;color:var(--muted)}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-of-type{border-bottom:0}
.ln{font-weight:700;overflow-wrap:anywhere}
.lt{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.qty{display:flex;gap:6px;align-items:center}
.sq{width:48px;padding:0;font-size:24px}
.qn{width:72px;text-align:center;font-weight:800}
.x{width:48px;padding:0;color:var(--bad);margin-left:auto}
.disc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;border-top:2px solid var(--line)}
.seg{display:flex}
.seg button{border-radius:0;min-width:52px;padding:0 10px}
.seg button:first-child{border-radius:12px 0 0 12px}
.seg button:last-child{border-radius:0 12px 12px 0;margin-left:-2px}
.seg button[aria-pressed=true],.chip[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--prit)}
.chip{min-height:40px;padding:0 12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-variant-numeric:tabular-nums}
.total{font-size:30px;font-weight:800;padding:8px 0}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:8px}
.pri{background:var(--pri);border-color:var(--pri);color:var(--prit);min-height:56px;font-size:19px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--hd);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bi{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bt{margin-right:auto;min-width:0;line-height:1.15}
.bt b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.bi .pri{min-height:52px;font-size:18px;padding:0 20px}
.toast{color:var(--bad);font-weight:700;padding-top:6px}
.f{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.f .full{grid-column:1/-1}
.lbl{font-size:14px;color:var(--muted);display:block;margin-bottom:3px}
.erow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.erow .full{grid-column:1/-1}
.bill{border-top:1px solid var(--line);padding:10px 0}
.bill>button{width:100%;text-align:left;border:0;background:none;display:flex;justify-content:space-between;gap:10px;min-height:44px;padding:0}
.rc{text-align:center}
.btn{display:grid;place-items:center;min-height:48px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:600;color:var(--text);text-decoration:none;padding:0 16px;text-align:center}
.rc .row{text-align:left}
.rc hr{border:0;border-top:2px dashed var(--line);margin:10px 0}
.ok{color:var(--ok);font-weight:800}
@media (min-width:820px){.cols.two{grid-template-columns:1.25fr 1fr;align-items:start}.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}.vb{display:none}.erow{grid-template-columns:2fr 1fr 1fr auto;align-items:end}.erow .full{grid-column:auto}.f{grid-template-columns:2fr 1fr 1fr auto;align-items:end}.f .full{grid-column:auto}}
@media print{body::before,.noprint{display:none!important}body{background:#fff;color:#000}.cols.two{display:block}.card{border:0}.cart{position:static}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const {useState,useEffect,useMemo,useRef}=React;
const h=React.createElement;
const KEY="fireworks-billing-v1";
const num=v=>Number(v)||0;
const r2=n=>Math.round(n*100)/100;
const money=n=>"₹"+r2(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const when=t=>new Date(t).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});
const blank={items:[],mult:1,bills:[],cart:{},disc:{type:"pct",val:""},next:1,shop:""};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.items))return{...blank,...d}}catch(e){}return blank}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
const PUBLIC_CFG={url:"",key:"",shop:""}; // optional: Supabase URL and anon key for shorter bill links, and your shop name for the customer bill page
const uuid=()=>crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=crypto.getRandomValues(new Uint8Array(1))[0]%16;return(c==="x"?r:(r&3|8)).toString(16)});
const SB="fwb-sb",SBQ="fwb-sb-q";
const sbCfg=()=>{try{return JSON.parse(localStorage.getItem(SB))||{}}catch(e){return{}}};
const sbQueue=()=>{try{return JSON.parse(localStorage.getItem(SBQ))||[]}catch(e){return[]}};
const sbSaveQ=q=>{try{localStorage.setItem(SBQ,JSON.stringify(q))}catch(e){}};
const sbBase=c=>c.url.replace(/\/+$/,"");
const sbReady=c=>!!(c.url&&c.key&&c.email&&c.pass);
const billLink=b=>{const c=sbCfg();if(!b||!b.id||!sbReady(c))return"";return location.origin+location.pathname+"?b="+b.id+(PUBLIC_CFG.url?"":"&u="+encodeURIComponent(c.url)+"&k="+encodeURIComponent(c.key))};
let sbTok=null,sbExp=0;
async function sbAuth(c){
  if(sbTok&&Date.now()<sbExp)return sbTok;
  const r=await fetch(sbBase(c)+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:c.key,"Content-Type":"application/json"},body:JSON.stringify({email:c.email,password:c.pass})});
  if(!r.ok)throw new Error(r.status===400||r.status===401?"Wrong email, password or project key.":"Sign-in failed ("+r.status+").");
  const j=await r.json();
  sbTok=j.access_token;sbExp=Date.now()+(j.expires_in||3600)*1000-60000;
  return sbTok;
}
async function sbSend(c,b,shop){
  if(!b.id)b.id=uuid();
  const tok=await sbAuth(c);
  const r=await fetch(sbBase(c)+"/rest/v1/bills?on_conflict=id",{method:"POST",headers:{apikey:c.key,Authorization:"Bearer "+tok,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:b.id,n:b.n,subtotal:b.sub,discount:b.disc,total:b.total,items:b.lines.reduce((s,l)=>s+l.qty,0),lines:b.lines})});
  if(!r.ok){if(r.status===401)sbTok=null;throw new Error(r.status===401||r.status===403?"Not allowed. Run the SQL setup again.":r.status===404?"Table named bills not found. Run the SQL setup.":"Saving bill details failed ("+r.status+").")}
}
async function sbFlush(shop){
  const c=sbCfg(),q=sbQueue();let sent=0,err="";
  if(!sbReady(c))return{sent:0,left:q.length,err:"Supabase is not set up."};
  while(q.length){
    try{await sbSend(c,q[0],shop);q.shift();sent++;sbSaveQ(q)}
    catch(e){err=e instanceof TypeError?"No connection, or the project URL is wrong.":e.message;break}
  }
  return{sent,left:q.length,err};
}
function mergeStatic(list,items){
  const idx=new Map(items.map(i=>[(i.name||"").trim().toLowerCase(),i]));
  const add=[],upd=[];let skip=0;
  list.forEach(x=>{
    const name=String(x&&x.name!=null?x.name:"").trim(),price=Number(x&&x.price);
    if(!name||isNaN(price)||price<0){skip++;return}
    const ex=idx.get(name.toLowerCase());
    if(ex)upd.push({id:ex.id,price,stock:ex.stock});
    else add.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),name,price,stock:Math.max(0,Math.floor(Number(x.stock)||0))});
  });
  return{add,upd,skip};
}

const pad=n=>String(n).padStart(2,"0");
const pdate=t=>{const d=new Date(t);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())};
const rs=n=>"Rs. "+r2(n).toFixed(2);
function makePdf(b,shop){
  const J=window.jspdf.jsPDF;
  const m=new J({unit:"mm",format:[80,200]});m.setFontSize(9);
  const rows=b.lines.map(l=>({a:m.splitTextToSize(l.name||"Item",44),q:l.qty+" x "+r2(l.price).toFixed(2),t:r2(l.price*l.qty).toFixed(2)}));
  const H=Math.max(70,52+rows.reduce((s,r)=>s+r.a.length*4+5,0)+(b.disc>0?5:0));
  const d=new J({unit:"mm",format:[80,H]});
  const line=y=>{d.setLineWidth(.2);d.line(5,y,75,y)};
  let y=10;
  d.setFont("helvetica","bold");d.setFontSize(13);d.text(shop||"Fireworks Bill",40,y,{align:"center"});
  y+=6;d.setFont("helvetica","normal");d.setFontSize(9);d.text("Bill #"+b.n+"   "+pdate(b.t),40,y,{align:"center"});
  y+=4;line(y);y+=5;
  rows.forEach(r=>{d.text(r.a,5,y);y+=r.a.length*4;d.text(r.q,5,y);d.text(r.t,75,y,{align:"right"});y+=5});
  line(y-1);y+=4;
  d.text("Subtotal",5,y);d.text(rs(b.sub),75,y,{align:"right"});y+=5;
  if(b.disc>0){d.text("Discount",5,y);d.text("- "+rs(b.disc),75,y,{align:"right"});y+=5}
  d.setFont("helvetica","bold");d.setFontSize(12);d.text("Total",5,y+1);d.text(rs(b.total),75,y+1,{align:"right"});
  y+=10;d.setFont("helvetica","normal");d.setFontSize(9);d.text("Thank you!",40,y,{align:"center"});
  return d;
}
function storePdf(b,shop){
  try{const uri=makePdf(b,shop).output("datauristring");localStorage.setItem("fwb-pdf-"+b.n,uri);return uri}catch(e){return null}
}
const hasPdf=n=>{try{return localStorage.getItem("fwb-pdf-"+n)!==null}catch(e){return false}};
function waNum(s){let d=String(s).replace(/\D/g,"");if(d.length===11&&d[0]==="0")d=d.slice(1);if(d.length===10)d="91"+d;return d.length>=11&&d.length<=15?d:""}
function billText(b,shop,link){
  const L=["*"+(shop||"Fireworks Bill")+"*","Bill #"+b.n+" - "+pdate(b.t),""];
  b.lines.forEach(l=>L.push(l.name+" x "+l.qty+" = "+money(l.price*l.qty)));
  L.push("","Subtotal: "+money(b.sub));
  if(b.disc>0)L.push("Discount: - "+money(b.disc));
  L.push("*Total: "+money(b.total)+"*","","Thank you!");
  if(link)L.push("","View or download your bill:",link);
  return L.join("\n");
}
const waLink=(b,shop,ph,link)=>"https://wa.me/"+waNum(ph)+"?text="+encodeURIComponent(billText(b,shop,link));
async function sharePdf(b,shop){
  try{
    const blob=makePdf(b,shop).output("blob");
    const f=new File([blob],"bill-"+b.n+".pdf",{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      await navigator.share({files:[f],title:"Bill #"+b.n,text:(shop||"Fireworks Bill")+" - Bill #"+b.n+" - Total "+rs(b.total)});
      return "ok";
    }
    return "nosupport";
  }catch(e){return e&&e.name==="AbortError"?"cancel":"fail"}
}
function billCanvas(b,shop){
  const S=2,W=420,P=20,F='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  const draw=x=>{
    x.setTransform(S,0,0,S,0,0);
    x.fillStyle="#fff";x.fillRect(0,0,W,9999);x.fillStyle="#000";
    let y=P+14;
    const f=(sz,wt)=>{x.font=wt+" "+sz+"px "+F};
    const cen=(t,sz,wt)=>{f(sz,wt);x.textAlign="center";x.fillText(t,W/2,y);y+=sz+8};
    const row=(l,r,sz,wt)=>{f(sz,wt);x.textAlign="left";x.fillText(l,P,y);x.textAlign="right";x.fillText(r,W-P,y);y+=sz+8};
    const rule=()=>{y-=4;x.fillRect(P,y,W-2*P,1);y+=14};
    const wrap=(t,w)=>{f(16,"700");const o=[];let cur="";String(t).split(" ").forEach(wd=>{const n=cur?cur+" "+wd:wd;if(cur&&x.measureText(n).width>w){o.push(cur);cur=wd}else cur=n});o.push(cur);return o};
    cen(shop||"Fireworks Bill",22,"700");
    cen("Bill #"+b.n+"  "+pdate(b.t),14,"400");
    rule();
    b.lines.forEach(l=>{wrap(l.name||"Item",W-2*P).forEach(t=>{f(16,"700");x.textAlign="left";x.fillText(t,P,y);y+=22});row(l.qty+" × "+money(l.price),money(l.price*l.qty),15,"400")});
    rule();
    row("Subtotal",money(b.sub),16,"400");
    if(b.disc>0)row("Discount","− "+money(b.disc),16,"400");
    row("Total",money(b.total),24,"700");
    y+=4;cen("Thank you!",14,"400");
    return y+P-8;
  };
  const t=document.createElement("canvas");t.width=W*S;t.height=3000*S;
  const H=draw(t.getContext("2d"));
  const c=document.createElement("canvas");c.width=W*S;c.height=Math.ceil(H*S);
  draw(c.getContext("2d"));
  return c;
}
async function copyBillImage(b,shop){
  try{
    if(!navigator.clipboard||!window.ClipboardItem)return "nosupport";
    const bp=new Promise(res=>billCanvas(b,shop).toBlob(res,"image/png"));
    await navigator.clipboard.write([new ClipboardItem({"image/png":bp})]);
    return "ok";
  }catch(e){return "fail"}
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}
  catch(e){try{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(e2){return false}}
}
async function copyPdf(b,shop){
  try{
    if(!navigator.clipboard||!window.ClipboardItem)return "nosupport";
    const blob=makePdf(b,shop).output("blob");
    await navigator.clipboard.write([new ClipboardItem({"application/pdf":blob})]);
    return "ok";
  }catch(e){return "fail"}
}
function uriToBlob(uri){const s=atob(uri.split("base64,")[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:"application/pdf"})}
function showPdf(blob,name){
  const url=URL.createObjectURL(blob);
  let w=null;try{w=window.open(url,"_blank")}catch(e){}
  if(!w){try{const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  return !!w;
}

function parseRows(rows,items){
  rows=rows.filter(r=>r.some(c=>String(c).trim()!==""));
  if(!rows.length)return{err:"The file is empty."};
  const hd=rows[0].map(c=>String(c).trim().toLowerCase());
  const find=re=>hd.findIndex(c=>re.test(c));
  let ni=find(/name|item|product|particular|description/),pi=find(/price|rate|mrp|cost/),si=find(/stock|qty|quantity|count/),start=1;
  if(ni<0||pi<0){ni=0;pi=1;si=2;start=0}
  const idx=new Map(items.map(i=>[(i.name||"").trim().toLowerCase(),i]));
  const seen=new Map();let skip=0;
  for(let k=start;k<rows.length;k++){
    const r=rows[k],name=String(r[ni]==null?"":r[ni]).trim();
    const pv=String(r[pi]==null?"":r[pi]).replace(/[₹,\s]/g,"");
    const p=pv===""?NaN:Number(pv);
    const sv=si<0?"":String(r[si]==null?"":r[si]).replace(/[,\s]/g,"");
    const st=sv===""?(si<0?null:0):Number(sv);
    if(!name||isNaN(p)||p<0||(st!==null&&(isNaN(st)||st<0))){skip++;continue}
    seen.set(name.toLowerCase(),{name,price:p,stock:st===null?null:Math.floor(st)});
  }
  const add=[],upd=[];
  seen.forEach((v,key)=>{
    const ex=idx.get(key);
    if(ex)upd.push({id:ex.id,price:v.price,stock:v.stock===null?ex.stock:v.stock});
    else add.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),name:v.name,price:v.price,stock:v.stock===null?0:v.stock});
  });
  if(!add.length&&!upd.length)return{err:"No valid items found. Each row needs a name and a price."};
  return{add,upd,skip};
}

function App(){
  const [db,setDb]=useState(load);
  const [tab,setTab]=useState("bill");
  const [done,setDone]=useState(null);
  useEffect(()=>{save(db)},[db]);
  useEffect(()=>{if(sbReady(sbCfg())&&sbQueue().length)sbFlush(db.shop)},[]);
  useEffect(()=>{
    if(db.items.length)return;
    fetch("db.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{
      const list=d&&(Array.isArray(d)?d:d.items);
      if(!Array.isArray(list))return;
      const m=mergeStatic(list,[]);
      if(m.add.length)setDb(o=>o.items.length?o:{...o,items:m.add});
    }).catch(()=>{});
  },[]);
  const set=p=>setDb(d=>({...d,...(typeof p==="function"?p(d):p)}));
  const tabBtn=(k,t)=>h("button",{className:"tab","aria-pressed":tab===k,onClick:()=>setTab(k)},t);
  return h("div",null,
    h("div",{className:"hd noprint"},h("h1",null,db.shop||"Fireworks Billing"),tabBtn("bill","Bill"),tabBtn("admin","Admin")),
    h("div",{className:"wrap"},tab==="bill"?h(Bill,{db,set,done,setDone}):h(Admin,{db,set})));
}

function Bill({db,set,done,setDone}){
  const [q,setQ]=useState("");
  const [msg,setMsg]=useState("");
  const [arm,setArm]=useState(false);
  const [pmsg,setPmsg]=useState("");
  const [ph,setPh]=useState("");
  const [wmsg,setWmsg]=useState("");
  const [cmsg,setCmsg]=useState(null);
  const [cloud,setCloud]=useState(null);
  const sendPdf=async()=>{
    const r=await sharePdf(done,db.shop);
    setWmsg(r==="ok"||r==="cancel"?"":"Sharing a file is not available in this browser. Use Send text bill, or save the PDF and attach it in WhatsApp.");
  };

function Viewer(){

    fetch(sbBase(c)+"/rest/v1/rpc/get_bill",{method:"POST",headers:{apikey:c.key,"Content-Type":"application/json"},body:JSON.stringify({p_id:id})})

      .catch(e=>setSt(e===400?{s:"none"}:{s:"err",m:typeof e==="number"?"Could not load the bill ("+e+").":"No connection. Try again."}));
  },[]);
  const b=st.b;
  const download=()=>{try{makePdf(b,b.shop||PUBLIC_CFG.shop).save("bill-"+b.n+".pdf")}catch(e){}};
  return h("div",{className:"wrap"},h("section",{className:"card rc"},
    st.s==="load"?h("div",{className:"empty"},"Loading your bill…"):
    st.s==="none"?h("div",{className:"empty"},"This bill was not found. Check the link."):
    st.s==="err"?h("div",{className:"toast",role:"alert"},st.m):
    h("div",null,
      h("h2",null,b.shop||PUBLIC_CFG.shop||"Bill"),
      h("div",{className:"muted"},"Bill #"+b.n+" · "+when(b.t)),
      h("hr"),
      b.lines.map((l,i)=>h("div",{className:"row",key:i},h("span",null,l.name+" × "+l.qty),h("span",null,money(l.price*l.qty)))),
      h("hr"),
      h("div",{className:"row"},h("span",null,"Subtotal"),h("span",null,money(b.sub))),
      b.disc>0?h("div",{className:"row"},h("span",null,"Discount"),h("span",null,"− "+money(b.disc))):null,
      h("div",{className:"row total"},h("span",null,"Total"),h("span",null,money(b.total))),
      h("div",{className:"acts noprint",style:{gridTemplateColumns:"1fr 1fr"}},
        h("button",{className:"pri",onClick:download},"Download PDF"),
        h("button",{onClick:()=>{try{window.print()}catch(e){}}},"Print")))));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(new URLSearchParams(location.search).get("b")?Viewer:App));
</script>
</body>
</html>
